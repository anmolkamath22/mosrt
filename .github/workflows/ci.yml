name: MOSRT CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install quality tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck lcov valgrind

      - name: Build (with -Werror)
        working-directory: mosrt
        run: make

      - name: Unit tests
        working-directory: mosrt
        run: make unit

      - name: Integration tests
        working-directory: mosrt
        run: make integration

      - name: Stress tests
        working-directory: mosrt
        run: make stress

      - name: Benchmarks
        working-directory: mosrt
        run: make bench

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: mosrt/benchmarks/results/

      - name: Format check
        working-directory: mosrt
        run: make format-check

      - name: cppcheck
        working-directory: mosrt
        run: make cppcheck

      - name: clang-tidy
        working-directory: mosrt
        run: make tidy

      - name: Sanitizers (ASan + UBSan)
        working-directory: mosrt
        run: make sanitize

      - name: Valgrind (unit tests)
        working-directory: mosrt
        run: |
          make clean && make CFLAGS='-std=c17 -Wall -Wextra -Wpedantic -Werror -g -O0'
          make unit
          valgrind --error-exitcode=1 --leak-check=full ./tests/test_ipc_sync
          valgrind --error-exitcode=1 --leak-check=full ./tests/test_workload
          valgrind --error-exitcode=1 --leak-check=full ./tests/test_scheduler
          valgrind --error-exitcode=1 --leak-check=full ./tests/test_proc
          valgrind --error-exitcode=1 --leak-check=full ./tests/test_log

      - name: Coverage
        working-directory: mosrt
        run: make coverage
